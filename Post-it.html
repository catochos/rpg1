<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-it 3D RPG - Cronograma de Provas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            user-select: none;
        }
        .handwriting {
            font-family: 'Caveat', cursive;
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <div class="absolute top-4 left-4 z-10 bg-black/40 backdrop-blur-md text-white p-4 rounded-2xl border border-white/10 shadow-2xl max-w-xs pointer-events-none">
        <h1 class="text-lg font-semibold tracking-wide text-pink-300">📜 Calendário de Missões</h1>
        <p class="text-xs text-gray-300 mt-1">Arraste para girar em 3D, use o scroll para aproximar. Perfeito para os jogadores do RPG!</p>
        <div class="mt-3 text-[10px] text-pink-400 bg-pink-950/40 px-2 py-1 rounded border border-pink-500/20 inline-block">
            Item Mágico: Post-it Rosa Ancestral
        </div>
    </div>

    <!-- Instructions helper footer -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 text-white/50 text-xs pointer-events-none text-center">
        Clique e arraste para inspecionar o bilhete em 3D
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e24);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 7.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 12;
        controls.minDistance = 3;
        controls.maxPolarAngle = Math.PI / 2 + 0.3;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xfff5f8, 1.2);
        directionalLight.position.set(4, 6, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.bias = -0.0001;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0xffd1dc, 0.4);
        fillLight.position.set(-5, -2, -3);
        scene.add(fillLight);

        function createStickyTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Pink sticky note background
            ctx.fillStyle = '#ff77a9'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle paper texture grain
            ctx.fillStyle = 'rgba(0,0,0,0.03)';
            for (let i = 0; i < 4000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }

            // Sticky glue strip at top
            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.fillRect(0, 0, canvas.width, 100);

            // Realistic black handwriting ink
            ctx.fillStyle = '#111111';
            ctx.font = 'bold 54px "Caveat", cursive';

            const lines = [
                "1/10 prova de ciencias",
                "4/10 prova de português",
                "4/10 prova de ingles",
                "5/10 prova de matematica",
                "6/10 prova de historia",
                "6/10 prova de geografia"
            ];

            let startY = 220;
            const lineHeight = 105;

            lines.forEach((line, index) => {
                const offsetX = 110 + (Math.sin(index * 2) * 4);
                ctx.fillText(line, offsetX, startY + (index * lineHeight));
            });

            // (Sinal de certo removido conforme solicitado)

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return texture;
        }

        const noteWidth = 4.2;
        const noteHeight = 4.2;

        const geometry = new THREE.PlaneGeometry(noteWidth, noteHeight);

        const stickyTexture = createStickyTexture();
        const material = new THREE.MeshStandardMaterial({
            map: stickyTexture,
            roughness: 0.85,
            metalness: 0.05,
            side: THREE.DoubleSide
        });

        const stickyNote = new THREE.Mesh(geometry, material);
        stickyNote.castShadow = true;
        stickyNote.receiveShadow = true;
        
        // Slight tilt for dynamic 3D presentation
        stickyNote.rotation.z = -0.05;
        stickyNote.rotation.x = 0.05;
        scene.add(stickyNote);

        const deskGeometry = new THREE.PlaneGeometry(30, 30);
        const deskMaterial = new THREE.MeshStandardMaterial({
            color: 0x2b2520,
            roughness: 0.7,
            metalness: 0.1
        });
        const desk = new THREE.Mesh(deskGeometry, deskMaterial);
        desk.position.z = -0.5;
        desk.receiveShadow = true;
        scene.add(desk);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Gentle floating/breathing animation
            stickyNote.position.y = Math.sin(elapsedTime * 1.5) * 0.04;
            stickyNote.rotation.y = Math.sin(elapsedTime * 0.8) * 0.05;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
