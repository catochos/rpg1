<style>
:root{--bg:#000;--fg:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}

.b:hover{background:#2a2a2a}
#ui{flex-wrap:wrap;max-width:70vw;position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}

const T=THREE,cv=document.getElementById('c');

const S=new T.Scene();S.background=new T.Color(0x000000);S.fog=new T.Fog(0x000000,7,18);
const cam=new T.PerspectiveCamera(40,1,.1,50);

const FONT='"Segoe Print","Bradley Hand","Comic Sans MS",cursive';
const rr=(c,x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()};
const P=(c,f)=>{c.fillStyle=f;c.fill();c.stroke()};
const circ=(c,x,y,r,f)=>{c.beginPath();c.arc(x,y,r,0,7);P(c,f)};
