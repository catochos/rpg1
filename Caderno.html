<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno</title>
<style>
:root{--bg:#000;--fg:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
.b{background:#1b1b1b;color:#ddd;border:1px solid #444;border-radius:8px;padding:8px 12px;font:13px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.b:hover{background:#2a2a2a}
#ui{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap}
#h{position:fixed;left:12px;bottom:12px;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid #333;padding:6px 10px;border-radius:8px;opacity:.85;pointer-events:none;max-width:min(460px,70vw)}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui"><button class="b" id="bP">&#9664; Folha anterior</button><button class="b" id="bN">Próxima folha &#9654;</button></div>
<div id="h">Clique no caderno: lado direito avança a folha, lado esquerdo volta. Arraste para mover o caderno. Botão direito + mover: gira a câmera. W A S D: desloca a câmera (R reinicia). Roda do mouse: zoom.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,cv=document.getElementById('c');
const R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const S=new T.Scene();S.background=new T.Color(0);S.fog=new T.Fog(0,12,28);
const cam=new T.PerspectiveCamera(40,1,.1,60);
// luz: abajur quente de cima + ambiente bem fraco
S.add(new T.HemisphereLight(0x303a55,0x080808,.4));
const lamp=new T.SpotLight(0xffe2b0,1.5,0,.9,.6,1);lamp.position.set(-2.5,6,3);lamp.castShadow=true;lamp.shadow.mapSize.set(2048,2048);lamp.shadow.bias=-.0003;S.add(lamp);

function tex(w,h,fn){const k=document.createElement('canvas');k.width=w;k.height=h;fn(k.getContext('2d'),w,h);const t=new T.CanvasTexture(k);t.anisotropy=8;return t}
const FONT='"Segoe Print","Bradley Hand","Comic Sans MS",cursive',PW=768,PH=1024;

// mesa de madeira
const wood=tex(1024,512,(c,W,H)=>{c.fillStyle='#6b4a2e';c.fillRect(0,0,W,H);
 for(let i=0;i<260;i++){c.strokeStyle='rgba('+(Math.random()<.5?'30,18,8':'150,110,70')+','+Math.random()*.18+')';c.lineWidth=1+Math.random()*2;const y=Math.random()*H;c.beginPath();c.moveTo(0,y);c.bezierCurveTo(W*.3,y+Math.random()*10-5,W*.6,y+Math.random()*10-5,W,y+Math.random()*8-4);c.stroke()}
 c.strokeStyle='rgba(20,10,4,.5)';c.lineWidth=3;[128,256,384].forEach(y=>{c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()})});
const table=new T.Mesh(new T.BoxGeometry(16,.4,10),new T.MeshStandardMaterial({map:wood,roughness:.55}));table.position.y=-.2;S.add(table);

// páginas
function wrap(c,t,x,y,mw,lh){let l='';for(const w of t.split(' ')){const n=l?l+' '+w:w;if(c.measureText(n).width>mw&&l){c.fillText(l,x,y);y+=lh;l=w}else l=n}c.fillText(l,x,y);return y+lh}
function paperTex(fn){return tex(PW,PH,c=>{c.fillStyle='#f6f1e2';c.fillRect(0,0,PW,PH);c.strokeStyle='rgba(70,110,190,.35)';c.lineWidth=2;
 for(let y=102;y<PH-20;y+=52){c.beginPath();c.moveTo(0,y);c.lineTo(PW,y);c.stroke()}
 c.strokeStyle='rgba(200,60,60,.5)';c.beginPath();c.moveTo(96,0);c.lineTo(96,PH);c.stroke();if(fn)fn(c)})}
function entry(date,txt,list){return paperTex(c=>{c.fillStyle='#1c2f6b';c.font='bold 54px '+FONT;c.fillText(date,118,96);c.font='34px '+FONT;
 let y=wrap(c,txt,118,148,PW-118-36,52)+52;list.forEach(l=>{c.fillText('\u2022  '+l,140,y);y+=52})})}
const plain=col=>tex(PW,PH,c=>{c.fillStyle=col;c.fillRect(0,0,PW,PH);for(let i=0;i<2500;i++){c.fillStyle='rgba(255,255,255,'+Math.random()*.04+')';c.fillRect(Math.random()*PW,Math.random()*PH,2,2)}});
const coverT=tex(PW,PH,c=>{c.drawImage(plain('#1d3a6b').image,0,0);c.fillStyle='#f4efe0';c.fillRect(184,300,400,220);c.strokeStyle='#1d3a6b';c.lineWidth=6;c.strokeRect(196,312,376,196);
 c.fillStyle='#1d3a6b';c.font='bold 64px '+FONT;c.textAlign='center';c.fillText('CADERNO',384,430)});
// diário: um dia por folha (09/09/04 a 16/09/04)
const dias=[
['09/09/04','A sofia acordou de bom humor hoje. Brincou um bom tempo com o móbile do berço e quase não chorou. Bebeu o leite direitinho, como combinado',
 ['14:30 acordou','15:00 60 ml de leite','15:30 comeu','18:20 80 ml de leite','19:05 Dormiu']],
['10/09/04','Dia de chuva. Ela ficou mais quietinha e queria colo o tempo todo. Cantei baixinho e ela foi relaxando. Bebeu a quantidade de sempre',
 ['14:35 acordou','15:00 60 ml de leite','15:40 comeu','18:30 80 ml de leite','19:10 Dormiu']],
['11/09/04','Hoje ela acordou meio manhosa. Passei a pomadinha na assadura, como combinado, e já melhorou. Tomou o leite normal e comeu bem',
 ['14:20 acordou','14:50 60 ml de leite','15:20 comeu','16:10 troquei a fralda','18:25 80 ml de leite','19:00 Dormiu']],
['12/09/04','Dia calmo. Ela quis brincar com o cobertozinho e não largou mais. Bebeu a mesma quantidade de sempre e ficou sorrindo pra mim a tarde toda',
 ['14:30 acordou','15:00 60 ml de leite','15:30 comeu','17:45 troquei a fralda','18:25 80 ml de leite','19:00 Dormiu']],
['13/09/04','A sofia estava um pouquinho agitada hoje, acho que por causa do calor. Dei um banho morninho e ela acalmou. Bebeu um pouco menos de leite, mas comeu bem',
 ['14:25 acordou','14:55 50 ml de leite','15:30 comeu','17:00 banho','18:30 70 ml de leite','19:10 Dormiu']],
['14/09/04','Tudo tranquilo hoje. Ela sorriu bastante e tentou segurar a mamadeira sozinha. Anotei aqui o que você me falou sobre o leite da noite: se ela beber demais de tarde, não dar mais de noite',
 ['14:30 acordou','15:00 60 ml de leite','15:30 comeu','18:20 80 ml de leite','18:55 Dormiu']],
['15/09/04','Além de beber um pouco mais do que o normal, nada de especial aconteceu hoje. Como ela bebeu demais, segui suas instruções e não dei mais leite de noite. E eu cantei uma canção de ninar pra ela. Ela toda linda dormiu agarrada com seu cobertozinho no berço',
 ['14:50 Comeu','15:10 200ml de leite','18:30 troquei a fralda','19:15 Dormiu']],
['16/09/04','Hoje a sofia não estava agitada. Ela bebeu a mesma quantidade de sempre e dormiu um pouco mais cedo',
 ['14:30 acordou','15:00 60 ml de leite','15:30 comeu','18:25 80 ml de leite','19:00 Dormiu']]
];

// folhas: capa, uma por dia, contracapa
const SW=2.2,SD=3.0,GAP=.004;
const sp=[{t:.03,f:coverT,b:plain('#cdbf9f'),c:0x1d3a6b},
 ...dias.map(d=>({t:.008,f:entry(d[0],d[1],d[2]),b:paperTex(),c:0xf1ebd8})),
 {t:.03,f:plain('#cdbf9f'),b:plain('#1d3a6b'),c:0x1d3a6b}];
const nb=new T.Group();S.add(nb);
const bF=new T.Matrix4().makeBasis(new T.Vector3(1,0,0),new T.Vector3(0,0,-1),new T.Vector3(0,1,0));
const bB=new T.Matrix4().makeBasis(new T.Vector3(-1,0,0),new T.Vector3(0,0,-1),new T.Vector3(0,-1,0));
const sheets=sp.map((d,i)=>{
 const yR=sp.slice(i+1).reduce((a,x)=>a+x.t+GAP,0)+d.t/2+GAP, yL=sp.slice(0,i).reduce((a,x)=>a+x.t+GAP,0)+d.t/2+GAP;
 const g=new T.Group();nb.add(g);
 const body=new T.Mesh(new T.BoxGeometry(SW,d.t,SD),new T.MeshStandardMaterial({color:d.c,roughness:.85}));body.position.x=SW/2;g.add(body);
 [[d.f,bF,1],[d.b,bB,-1]].forEach(([t,m,k])=>{const p=new T.Mesh(new T.PlaneGeometry(SW,SD),new T.MeshStandardMaterial({map:t,roughness:.9}));
  p.quaternion.setFromRotationMatrix(m);p.position.set(SW/2,k*(d.t/2+.0006),0);g.add(p)});
 return{g,yR,yL,p:0,tg:0}});
// espiral
for(let i=0;i<10;i++){const r=new T.Mesh(new T.TorusGeometry(.1,.012,8,20),new T.MeshStandardMaterial({color:0xb8b8c0,metalness:.7,roughness:.3}));r.position.set(0,.08,-1.3+i*.29);nb.add(r)}
S.traverse(o=>{if(o.isMesh){o.receiveShadow=true;o.castShadow=o!==table}});
const ease=p=>p*p*(3-2*p);
function next(){const s=sheets.find(s=>s.tg===0);if(s)s.tg=1}
function prev(){const s=[...sheets].reverse().find(s=>s.tg===1);if(s)s.tg=0}
document.getElementById('bN').onclick=next;document.getElementById('bP').onclick=prev;

// câmera e mouse
let th=0,ph=.95,rad=6.5,mode=0,lx=0,ly=0,moved=0,grab=null,offX=0,offZ=0;
const tgt=new T.Vector3(0,0,.2),keys={};
function upd(){tgt.x=Math.max(-6,Math.min(6,tgt.x));tgt.y=Math.max(-.5,Math.min(4,tgt.y));tgt.z=Math.max(-5,Math.min(5,tgt.z));
 cam.position.set(tgt.x+rad*Math.sin(th)*Math.cos(ph),tgt.y+rad*Math.sin(ph),tgt.z+rad*Math.cos(th)*Math.cos(ph));cam.lookAt(tgt)}
function pan(dx,dy){cam.updateMatrix();const r=new T.Vector3().setFromMatrixColumn(cam.matrix,0),u=new T.Vector3().setFromMatrixColumn(cam.matrix,1);tgt.addScaledVector(r,dx).addScaledVector(u,dy);upd()}
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();upd();
const rc=new T.Raycaster(),mp=new T.Vector2(),pl=new T.Plane(new T.Vector3(0,1,0),-.05),hp=new T.Vector3();
const ray=e=>{mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);rc.setFromCamera(mp,cam)};
const hitNB=e=>{ray(e);const h=rc.intersectObject(nb,true);return h.length?h[0]:null};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);lx=e.clientX;ly=e.clientY;moved=0;mode=0;
 if(e.button===2){mode=1;return}if(e.button!==0)return;
 const h=hitNB(e);if(h){ray(e);rc.ray.intersectPlane(pl,hp);grab={ox:offX-hp.x,oz:offZ-hp.z,fwd:h.point.x>=nb.position.x};cv.style.cursor='grabbing'}
 else if(e.pointerType==='touch')mode=1});
cv.addEventListener('pointermove',e=>{const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
 if(grab){ray(e);if(rc.ray.intersectPlane(pl,hp)){offX=Math.max(-4,Math.min(4,hp.x+grab.ox));offZ=Math.max(-2.5,Math.min(2.5,hp.z+grab.oz))}}
 else if(mode===1&&e.buttons){th+=dx*.006;ph=Math.max(.15,Math.min(1.5,ph-dy*.005));upd()}
 else if(!e.buttons)cv.style.cursor=hitNB(e)?'pointer':'default'});
const up=()=>{if(grab&&moved<6)grab.fwd?next():prev();grab=null;mode=0;cv.style.cursor='default'};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.max(1.5,Math.min(12,rad*(1+e.deltaY*.001)));upd()},{passive:false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='r'&&!e.repeat){th=0;ph=.95;rad=6.5;tgt.set(0,0,.2);upd();return}
 if(k.length===1&&'wasd'.includes(k))keys[k]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

const clock=new T.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);
 {const v=rad*dt*.6;if(keys.w)pan(0,v);if(keys.s)pan(0,-v);if(keys.a)pan(-v,0);if(keys.d)pan(v,0)}
 sheets.forEach(s=>{s.p+=Math.sign(s.tg-s.p)*Math.min(Math.abs(s.tg-s.p),dt*1.5);const e=ease(s.p);
  s.g.rotation.z=e*Math.PI;s.g.position.y=s.yR+(s.yL-s.yR)*e});
 nb.position.x=offX-(SW/2)*(1-ease(sheets[0].p))+(SW/2)*ease(sheets[sheets.length-1].p);nb.position.z=offZ;
 R.render(S,cam)})();
</script></body></html>
