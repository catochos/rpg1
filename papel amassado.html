<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prop 3D - Bilhete Manuscrito Inteiro (RPG 2004)</title>
    <!-- Importando a fonte manuscrita 'Caveat' e a Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Roboto', sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px #000;
        }
    </style>
</head>
<body>
    <div id="info">Use WASD para mover a câmera. Scroll para dar zoom. Clique e arraste para examinar o bilhete.</div>

    <!-- Importando Three.js e OrbitControls via CDN estável -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- CONFIGURAÇÃO DA CENA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.minDistance = 3;
        controls.maxDistance = 15;

        // --- CONTROLE DE MOVIMENTO COM WASD ---
        const moveState = { forward: false, backward: false, left: false, right: false };
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') moveState.forward = true;
            if (e.key === 's' || e.key === 'S') moveState.backward = true;
            if (e.key === 'a' || e.key === 'A') moveState.left = true;
            if (e.key === 'd' || e.key === 'D') moveState.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') moveState.forward = false;
            if (e.key === 's' || e.key === 'S') moveState.backward = false;
            if (e.key === 'a' || e.key === 'A') moveState.left = false;
            if (e.key === 'd' || e.key === 'D') moveState.right = false;
        });

        function updateCameraPosition() {
            const speed = 0.05;
            if (moveState.forward) controls.target.y += speed;
            if (moveState.backward) controls.target.y -= speed;
            if (moveState.left) controls.target.x -= speed;
            if (moveState.right) controls.target.x += speed;
        }

        // --- ILUMINAÇÃO ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff8e7, 0.8);
        dirLight.position.set(3, 8, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- GERANDO A TEXTURA DE COR COM LETRA MANUSCRITA ---
        const colorCanvas = document.createElement('canvas');
        colorCanvas.width = 1024;
        colorCanvas.height = 1024;
        const ctx = colorCanvas.getContext('2d');

        // Fundo do papel amarelado envelhecido
        ctx.fillStyle = '#f7f3e8';
        ctx.fillRect(0, 0, colorCanvas.width, colorCanvas.height);

        // Linhas de caderno azuladas suaves
        ctx.strokeStyle = '#d0dbe8';
        ctx.lineWidth = 2;
        for (let y = 80; y < colorCanvas.height; y += 45) {
            ctx.beginPath();
            ctx.moveTo(30, y);
            ctx.lineTo(colorCanvas.width - 30, y);
            ctx.stroke();
        }

        // Escrevendo o texto com fonte manuscrita 'Caveat'
        ctx.font = 'bold 44px "Caveat", cursive';
        
        const lines = [
            { text: "- Alimentar com leite as 15:00", red: false },
            { text: "- Alimentar novamente as 18:30", red: false },
            { text: "- lembrar de colocar o leite na geladeira", red: false },
            { text: "- lembrar de esquentar o leite", red: false },
            { text: "- NAO TIRAR OS OLHOS DELA!!!!", red: true },
            { text: "- anote tudo por favor!", red: false },
            { text: "- eu volto as 20:00", red: false }
        ];

        let startY = 145;
        lines.forEach((item, index) => {
            let offsetX = 130; 

            if (item.red) ctx.fillStyle = '#b51a1a'; // Vermelho forte para o aviso
            else ctx.fillStyle = '#1c2d42'; // Azul de caneta esferográfica

            ctx.fillText(item.text, offsetX, startY);
            startY += 90;
        });

        const colorTexture = new THREE.CanvasTexture(colorCanvas);
        colorTexture.minFilter = THREE.LinearFilter;

        // --- CRIANDO A GEOMETRIA E MATERIAL DA FOLHA INTEIRA ---
        const planeGeo = new THREE.PlaneGeometry(4, 5, 32, 32);
        
        const positionAttribute = planeGeo.attributes.position;
        const vertex = new THREE.Vector3();

        // Leves amassados e dobras na folha inteira
        for (let i = 0; i < positionAttribute.count; i++) {
            vertex.fromBufferAttribute(positionAttribute, i);

            let waveZ = Math.sin(vertex.x * 3.5) * Math.cos(vertex.y * 3.0) * 0.12;
            let foldZ = Math.cos(vertex.x * 6.0 + vertex.y * 5.0) * 0.05;
            vertex.z += waveZ + foldZ;

            positionAttribute.setXYZ(i, vertex.x, vertex.y, vertex.z);
        }
        planeGeo.computeVertexNormals();

        const paperMaterial = new THREE.MeshStandardMaterial({
            map: colorTexture,
            roughness: 0.8,
            metalness: 0.05,
            side: THREE.DoubleSide
        });

        const paperMesh = new THREE.Mesh(planeGeo, paperMaterial);
        paperMesh.castShadow = true;
        paperMesh.receiveShadow = true;
        paperMesh.rotation.z = -0.08;
        paperMesh.rotation.x = 0.1;
        scene.add(paperMesh);

        // --- LOOP DE ANIMAÇÃO ---
        function animate() {
            requestAnimationFrame(animate);
            updateCameraPosition();
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
