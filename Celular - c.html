    <script>
        // --- CONFIGURAÇÃO DA CENA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.minDistance = 5;
        controls.maxDistance = 25;

        // --- CONTROLE DE MOVIMENTO COM WASD ---
        const moveState = { forward: false, backward: false, left: false, right: false };
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') moveState.forward = true;
            if (e.key === 's' || e.key === 'S') moveState.backward = true;
            if (e.key === 'a' || e.key === 'A') moveState.left = true;
            if (e.key === 'd' || e.key === 'D') moveState.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') moveState.forward = false;
            if (e.key === 's' || e.key === 'S') moveState.backward = false;
            if (e.key === 'a' || e.key === 'A') moveState.left = false;
            if (e.key === 'd' || e.key === 'D') moveState.right = false;
        });

        function updateCameraPosition() {
            const speed = 0.1;
            if (moveState.forward) controls.target.y += speed;
            if (moveState.backward) controls.target.y -= speed;
            if (moveState.left) controls.target.x -= speed;
            if (moveState.right) controls.target.x += speed;
        }

        function wrapTextAndGetLines(ctx, text, maxWidth) {
            const words = text.split(' ');
            let lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                let width = ctx.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        // Função para desenhar a interface LCD no Canvas
        function updateScreenCanvas() {
            ctx.fillStyle = '#c7d7c5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Barra de status superior fixa
            ctx.fillStyle = '#2f3e2e';
            ctx.fillRect(0, 0, canvas.width, 24);
            ctx.fillStyle = '#c7d7c5';
            ctx.font = '11px Roboto, sans-serif';
            ctx.fillText("TCL 2004", 8, 16);
            ctx.fillText("📶 🔋", 205, 16);

            if (currentScreen === 'home') {
                ctx.fillStyle = '#2f3e2e';
                ctx.font = 'bold 13px Roboto, sans-serif';
                ctx.fillText("24 Set 2004", 85, 75);

                ctx.strokeStyle = '#2f3e2e';
                ctx.lineWidth = 1;
                ctx.strokeRect(20, 100, 216, 170);

                ctx.fillStyle = '#2f3e2e';
                ctx.font = '12px Roboto, sans-serif';
                ctx.fillText("> Menu Principal", 35, 135);
                ctx.fillText("  Mensagens (6)", 35, 165);
                ctx.fillText("  Contatos", 35, 195);
                ctx.fillText("  Configurações", 35, 225);

            } else if (currentScreen === 'menu') {
                ctx.fillStyle = '#2f3e2e';
                ctx.font = 'bold 13px Roboto, sans-serif';
                ctx.fillText("-- MENU PRINCIPAL --", 50, 45);

                const options = ["1. Mensagens", "2. Contatos", "3. Chamadas", "4. Configurações"];
                options.forEach((opt, idx) => {
                    ctx.strokeRect(20, 55 + (idx * 50), 216, 40);
                    ctx.fillText(opt, 35, 80 + (idx * 50));
                });

            } else if (currentScreen === 'messages') {
                ctx.fillStyle = '#2f3e2e';
                ctx.font = 'bold 12px Roboto, sans-serif';
                ctx.fillText("MENSAGENS (6)", 75, 42);

                // Renderiza a lista de conversas com rolagem simples se necessário
                conversations.forEach((conv, idx) => {
                    let boxTop = 55 + (idx * 45);
                    if (boxTop < 300) {
                        ctx.strokeRect(15, boxTop, 226, 38);
                        ctx.fillText(`• ${conv.name}`, 25, boxTop + 24);
                    }
                });

            } else if (currentScreen === 'chat') {
                const chat = conversations[selectedChatIndex];

                let startY = 38 - chatScrollOffset;
                let currentY = startY;

                chat.messages.forEach((m) => {
                    if (m.type === 'date') {
                        // Renderização de divisor de data
                        ctx.fillStyle = '#6b7d69';
                        ctx.font = 'bold 9px Roboto, sans-serif';
                        let textWidth = ctx.measureText(m.text).width;
                        let dateX = (canvas.width - textWidth) / 2;
                        
                        if (currentY + 15 > 32 && currentY < 300) {
                            ctx.fillText(m.text, dateX, currentY + 10);
                        }
                        currentY += 22;
                    } else {
                        const isCamila = (m.sender === 'Camila');
                        ctx.font = '10px Roboto, sans-serif';
                        
                        let maxBubbleWidth = 140;
                        let textLines = wrapTextAndGetLines(ctx, m.text, maxBubbleWidth);
                        let bubbleHeight = (textLines.length * 13) + 14;
                        let bubbleWidth = maxBubbleWidth + 10;
                        let bubbleX = isCamila ? (240 - bubbleWidth) : 15;

                        if (currentY + bubbleHeight > 32 && currentY < 300) {
                            ctx.fillStyle = isCamila ? '#a4bca2' : '#b2c4b0';
                            ctx.strokeStyle = '#2f3e2e';
                            ctx.lineWidth = 1;
                            ctx.fillRect(bubbleX, currentY, bubbleWidth, bubbleHeight);
                            ctx.strokeRect(bubbleX, currentY, bubbleWidth, bubbleHeight);

                            ctx.fillStyle = '#1b301a';
                            ctx.font = 'bold 9px Roboto, sans-serif';
                            
                            if (isCamila) {
                                let headerText = `${m.time} - ${m.sender}`;
                                let textWidth = ctx.measureText(headerText).width;
                                ctx.fillText(headerText, bubbleX + bubbleWidth - textWidth - 5, currentY + 11);
                            } else {
                                ctx.fillText(`${m.sender} - ${m.time}`, bubbleX + 5, currentY + 11);
                            }

                            ctx.fillStyle = '#111111';
                            ctx.font = '10px Roboto, sans-serif';
                            let textY = currentY + 23;
                            textLines.forEach(line => {
                                ctx.fillText(line, bubbleX + 5, textY);
                                textY += 13;
                            });
                        }

                        currentY += bubbleHeight + 6;
                    }
                });

                ctx.fillStyle = '#2f3e2e';
                ctx.fillRect(0, 0, canvas.width, 24);
                ctx.fillStyle = '#c7d7c5';
                ctx.font = '11px Roboto, sans-serif';
                ctx.fillText("TCL 2004", 8, 16);
                ctx.fillText("📶 🔋", 205, 16);
            }

            screenTexture.needsUpdate = true;
        }

        updateScreenCanvas();

        // --- CONSTRUÇÃO DO MODELO 3D DO CELULAR FIXO ---

        screenMesh.position.set(0, 2.0, 0.32);
        phoneGroup.add(screenMesh);

        leftSoftKey.position.set(-0.7, -0.05, 0.32);
        leftSoftKey.name = "btnLeft";

        rightSoftKey.name = "btnRight";
        phoneGroup.add(rightSoftKey);

        for (let r = 0; r < 4; r++) {

                const key = new THREE.Mesh(keyGeo, keyMaterial);
                key.position.set((c - 1) * 0.9, -0.7 - (r * 0.55), 0.32);
                phoneGroup.add(key);
            }
        }

        const antennaGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.2, 8);
        const antenna = new THREE.Mesh(antennaGeo, bodyMaterial);
        antenna.position.set(1.3, 4.25, 0);
        phoneGroup.add(antenna);

        // --- LÓGICA DE NAVEGAÇÃO, ZOOM E CLIQUES ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(screenMesh);
            isMouseOverScreen = (intersects.length > 0);

            // Bloqueia o zoom da câmera do OrbitControls se o mouse estiver sobre a tela do celular
            controls.enableZoom = !isMouseOverScreen;
        });

        window.addEventListener('wheel', (event) => {
            if (currentScreen === 'chat' && isMouseOverScreen) {
                event.preventDefault(); 
                chatScrollOffset += event.deltaY * 0.3;
                if (chatScrollOffset < 0) chatScrollOffset = 0;
                if (chatScrollOffset > 2200) chatScrollOffset = 2200; 
                updateScreenCanvas();
            }
        }, { passive: false });

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(phoneGroup.children, true);

            if (intersects.length > 0) {
                const hitObject = intersects[0].object;

                if (hitObject.name === "btnLeft") {
                    handleButtonAction('left');
                } else if (hitObject.name === "btnRight") {
                    handleButtonAction('right');
                } else if (hitObject.name === "phoneScreen") {
                    const uv = intersects[0].uv;
                    if (uv) {
                        const x = uv.x * canvas.width;
                        const y = (1 - uv.y) * canvas.height;
                        handleScreenClick(x, y);
                    }
                }
            }
        });

        function handleButtonAction(btn) {
            if (btn === 'left') {
                if (currentScreen === 'home') {
                    currentScreen = 'menu';
                } else if (currentScreen === 'menu') {
                    currentScreen = 'messages';
                }
            } else if (btn === 'right') {
                if (currentScreen === 'chat') {
                    currentScreen = 'messages';
                    chatScrollOffset = 0;
                } else if (currentScreen === 'messages') {
                    currentScreen = 'menu';
                } else if (currentScreen === 'menu') {
                    currentScreen = 'home';
                }
            }
            updateScreenCanvas();
        }

        function handleScreenClick(x, y) {
            if (currentScreen === 'home') {
                if (y > 100 && y < 270) {
                    currentScreen = 'menu';
                }
            } else if (currentScreen === 'menu') {
                for (let i = 0; i < 4; i++) {
                    let boxTop = 55 + (i * 50);
                    if (y >= boxTop && y <= boxTop + 40) {
                        if (i === 0) currentScreen = 'messages';
                        break;
                    }
                }
            } else if (currentScreen === 'messages') {
                for (let i = 0; i < conversations.length; i++) {
                    let boxTop = 55 + (i * 45);
                    if (y >= boxTop && y <= boxTop + 38) {
                        selectedChatIndex = i;
                        currentScreen = 'chat';
                        chatScrollOffset = 0;
                        break;
                    }
                }
            }
            updateScreenCanvas();
        }

        // --- LOOP DE ANIMAÇÃO ---
        function animate() {
            requestAnimationFrame(animate);
            updateCameraPosition();
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
