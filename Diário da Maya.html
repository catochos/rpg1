['16/08/2004','Fui muito bem em todas as minhas provas, yeyyyy!!! Eu estudei muito. Ainda tenho algumas pra fazer, mas acho que vou bem. Se meu pai estivesse aqui diria o quanto eu sou inteligente. Mas mamãe ficou com raiva dele e disse que ele não vai voltar.','f'],
['17/08/2004','A escola ensinou hoje a como plantar em jarrinhos. Mamãe comprou 3 vasinhos com semente de girassóis. Vou começar a plantar amanhã no meu quarto, yey!','p30'],
['18/08/2004','Plantei as sementes hoje! Fiz buraquinhos com o dedo, igualzinho a professora ensinou, e deixei os 3 vasinhos na janela do meu quarto pra pegar sol. Minha irmã disse que isso é coisa de criança, mas eu vi ela olhando escondida.','p30'],
['24/08/2004','Na aula de desenho a professora mandou a gente desenhar a família. Desenhei a mamãe, minha irmã e eu. Depois desenhei o papai bem pequenininho no cantinho da folha. A professora perguntou por que ele estava tão longe. Eu falei que ele vai voltar.','h'],
['28/08/2004','Os girassóis ainda não nasceram. Eu olho os vasinhos toda manhã antes de ir pra escola. Mamãe disse que precisa ter paciência, mas eu não sou muito boa nisso.','p30'],
['01/09/2004','Minha irmã quebrou meu ursinho de novo. Ela pediu desculpa, mas eu vi que ela não ficou triste. Mamãe disse que eu tenho que perdoar. Eu perdoei. Só um pouquinho.','h'],
['03/09/2004','NASCEU!!! Um brotinho verde saiu de um dos vasinhos! Corri pra mostrar pra mamãe, mas ela estava no telefone e só falou: depois, Maya.','p31'],
['05/09/2004','Saudades do papai… Às vezes eu cheiro aquela garrafa de bebida dele, pra me lembrar do seu cheiro. Mamãe viu e me fez jogar elas fora. Mas eu guardei uma embaixo da cama.',''],
['08/09/2004','Hoje eu esqueci meu lanche em casa. O Pedro, da minha sala, dividiu o dele comigo e disse que eu não precisava agradecer. Acho que a gente vai ser amigo.','f'],
['10/09/2004','Mamãe anda muito ocupada. Eu não gosto de ter babá, ela não deixa eu fazer nada! Queria que eles fizessem as pazes logo, mas mamãe e papai são mentirosos. Eles dizem que não posso brigar com a minha irmã e que tenho que perdoar ela quando quebra meus brinquedos, mas eles não se perdoam. Mesmo sem ele aqui, ainda ouço eles brigando no telefone. Papai disse pra mim que ia me resgatar da mamãe.',''],
['13/09/2004','Na aula de ciências aprendi que as plantas precisam de sol, água e carinho pra crescer. Eu acho que as pessoas também.',''],
['15/09/2004','Meu aniversário está chegando. Mas mamãe anda reclamando, não sei se vamos fazer alguma coisa esse ano…',''],

const mkc=()=>{const k=document.createElement('canvas');k.width=CW;k.height=CH;return[k,k.getContext('2d')]};
const tex=k=>{const x=new T.CanvasTexture(k);x.anisotropy=8;x.encoding=T.sRGBEncoding;return x};
function paper(c,L,col){c.fillStyle=col||'#f6eedc';c.fillRect(0,0,CW,CH);
 for(let i=0;i<500;i++){c.fillStyle='rgba(120,90,40,'+rnd()*.07+')';c.fillRect(rnd()*CW,rnd()*CH,1+rnd()*2,1+rnd()*2)}
 const g=c.createLinearGradient(L?CW:0,0,L?CW-70:70,0);g.addColorStop(0,'rgba(60,40,20,.3)');g.addColorStop(1,'rgba(60,40,20,0)');c.fillStyle=g;c.fillRect(0,0,CW,CH)}
function flw(c,x,y,r,n,pc,cc){c.lineWidth=2;c.strokeStyle='#4a3520';for(let i=0;i<n;i++){c.save();c.translate(x,y);c.rotate(i/n*6.283);c.fillStyle=pc;c.beginPath();c.ellipse(0,-r*.68,r*.27,r*.45,0,0,7);c.fill();c.stroke();c.restore()}
 c.fillStyle=cc;c.beginPath();c.arc(x,y,r*.34,0,7);c.fill();c.stroke()}
function stem(c,x,y,yb,b){c.strokeStyle='#3f8a45';c.lineWidth=5;c.beginPath();c.moveTo(x,yb);c.quadraticCurveTo(x+b,(y+yb)/2,x,y);c.stroke();
 c.fillStyle='#5fb35e';[.35,.6].forEach((f,i)=>{const s=i?1:-1;c.beginPath();c.ellipse(x+s*16+b*f*.4,yb+(y-yb)*f,16,7,-s*.5,0,7);c.fill()})}
const FL=[[12,'#ffc400','#6b3e14'],[9,'#ffffff','#ffd23f'],[5,'#ff7fae','#ffe27a'],[6,'#b48cf0','#fff2a8']];
function bloom(c,x,y,r,yb,k){const f=FL[k%4];stem(c,x,y,yb,(rnd()-.5)*40);flw(c,x,y,r,f[0],f[1],f[2])}
function wrap(c,s,w){const o=[];let l='';s.split(' ').forEach(d=>{const q=l?l+' '+d:d;if(c.measureText(q).width>w&&l){o.push(l);l=d}else l=q});o.push(l);return o}

function mkCover(){const[k,c]=mkc();c.fillStyle='#2f5d62';c.fillRect(0,0,CW,CH);
 for(let i=0;i<2500;i++){c.fillStyle='rgba('+(rnd()<.5?'255,255,255':'0,0,0')+','+rnd()*.06+')';c.fillRect(rnd()*CW,rnd()*CH,2,2)}
 c.setLineDash([10,8]);c.strokeStyle='#e7d9b0';c.lineWidth=3;c.strokeRect(26,26,CW-52,CH-52);c.setLineDash([]);
 const fs=[];for(let i=0;i<17;i++)fs.push([45+i*31+(rnd()-.5)*14,470+rnd()*170,28+rnd()*24,i]);
 fs.sort((a,b)=>a[1]-b[1]).forEach(([x,y,r,i])=>bloom(c,x,y,r,CH-26,i));
 [[70,82,26,1],[CW-70,82,26,2],[70,380,0,0]].slice(0,2).forEach(([x,y,r,i])=>flw(c,x,y,r,FL[i][0],FL[i][1],FL[i][2]));
 c.fillStyle='#f7efd8';c.fillRect(100,140,400,230);c.strokeStyle='#c9a96a';c.lineWidth=4;c.strokeRect(112,152,376,206);
 c.textAlign='center';c.fillStyle='#8c2f3d';c.font='bold 100px '+FF;c.fillText('Diário',300,262);
 c.fillStyle='#2f5d62';c.font='bold 80px '+FF;c.fillText('da Maya',300,342);return tex(k)}
function doodle(c,d,L){const x=L?150:CW-150,y=CH-70;
 if(d=='f')[[0,1],[55,0],[-50,2]].forEach(([dx,k],i)=>bloom(c,x+dx-10,y-60-i*12,20+rnd()*6,y+40,k));
 else if(d=='h'){c.fillStyle='#e8567a';c.strokeStyle='#8a2a45';c.lineWidth=3;c.beginPath();c.moveTo(x,y+30);c.bezierCurveTo(x-70,y-20,x-30,y-70,x,y-30);c.bezierCurveTo(x+30,y-70,x+70,y-20,x,y+30);c.fill();c.stroke()}
 else if(d=='m'){c.fillStyle='#e9c75a';c.beginPath();c.arc(x,y-10,36,0,7);c.fill();c.fillStyle='#f6eedc';c.beginPath();c.arc(x+16,y-20,32,0,7);c.fill();
  c.fillStyle='#e9c75a';[[x+40,y-50],[x+58,y],[x+30,y+25]].forEach(([a,b])=>{c.beginPath();c.arc(a,b,4,0,7);c.fill()})}
 else if(d[0]=='p'){const np=+d[1],ns=+d[2];for(let i=0;i<np;i++){const p=x+(i-(np-1)/2)*74;c.fillStyle='#c0623a';c.strokeStyle='#6b3419';c.lineWidth=3;
  c.beginPath();c.moveTo(p-26,y-10);c.lineTo(p+26,y-10);c.lineTo(p+18,y+40);c.lineTo(p-18,y+40);c.closePath();c.fill();c.stroke();c.fillStyle='#4a2c17';c.fillRect(p-26,y-16,52,8);
  if(i<ns){c.strokeStyle='#3f8a45';c.lineWidth=5;c.beginPath();c.moveTo(p,y-14);c.lineTo(p,y-44);c.stroke();c.fillStyle='#6fc46a';[-1,1].forEach(s=>{c.beginPath();c.ellipse(p+s*12,y-46,12,6,-s*.5,0,7);c.fill()})}}}}
function imgPage(c,L){const s=CW/IMG.width,h=IMG.height*s;c.drawImage(IMG,0,(CH-h)/2,CW,h);
 const g=c.createLinearGradient(L?CW:0,0,L?CW-70:70,0);g.addColorStop(0,'rgba(60,40,20,.3)');g.addColorStop(1,'rgba(60,40,20,0)');c.fillStyle=g;c.fillRect(0,0,CW,CH)}
function mkPage(f,e){const[k,c]=mkc(),L=f%2;paper(c,L);if(e&&e[2]=='img'){imgPage(c,L);return tex(k)}
 if(e){const x0=L?52:72,w=CW-124;c.fillStyle='#7a2f4d';c.font='bold 46px '+FF;c.fillText(e[0],x0,92);
  c.strokeStyle='#7a2f4d';c.lineWidth=2.5;c.beginPath();c.moveTo(x0,106);for(let x=x0;x<x0+220;x+=10)c.lineTo(x+5,106+((x/10)%2?3:-1));c.stroke();
  let fs=34,ln;for(;fs>=22;fs-=2){c.font=fs+'px '+FF;ln=wrap(c,e[1],w);if(ln.length*fs*1.25<470)break}
  c.fillStyle='#22377a';ln.forEach((s,i)=>{c.save();c.translate(x0+rnd()*4,158+i*fs*1.25);c.rotate((rnd()-.5)*.014);c.fillText(s,0,0);c.restore()});
  doodle(c,e[2],L)}return tex(k)}
function mkInside(){const[k,c]=mkc();paper(c,1,'#eadcc0');c.textAlign='center';c.fillStyle='#22377a';c.font='bold 46px '+FF;c.fillText('Este diário é da',300,200);
 c.fillStyle='#8c2f3d';c.font='bold 110px '+FF;c.fillText('Maya',300,320);c.fillStyle='#22377a';c.font='bold 44px '+FF;c.fillText('Proibido ler!!!',300,400);
 for(let i=0;i<5;i++)bloom(c,150+i*75+(rnd()-.5)*14,640+rnd()*40,26+rnd()*10,CH-30,i);return tex(k)}

function init(){
const cn=document.getElementById('c'),R=new T.WebGLRenderer({canvas:cn,antialias:true}),S=new T.Scene(),cam=new T.PerspectiveCamera(40,1,.1,60);
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.outputEncoding=T.sRGBEncoding;
S.background=new T.Color(0x17120e);
S.add(new T.HemisphereLight(0xfff0d8,0x2a1c12,.75));
const dl=new T.DirectionalLight(0xffe4bf,.85);dl.position.set(-2.5,5,3);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);
Object.assign(dl.shadow.camera,{left:-3.5,right:3.5,top:3.5,bottom:-3.5,near:1,far:14});dl.shadow.bias=-.0006;dl.shadow.normalBias=.02;S.add(dl);
// mesa de madeira
const wk=document.createElement('canvas');wk.width=wk.height=256;const wc=wk.getContext('2d');wc.fillStyle='#4b3021';wc.fillRect(0,0,256,256);
for(let i=0;i<260;i++){wc.fillStyle='rgba('+(rnd()<.5?'0,0,0':'255,220,170')+','+rnd()*.08+')';wc.fillRect(0,rnd()*256,256,1+rnd()*2)}
const wt=tex(wk);wt.wrapS=wt.wrapT=T.RepeatWrapping;wt.repeat.set(5,5);
const table=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshLambertMaterial({map:wt}));table.rotation.x=-Math.PI/2;table.position.y=-.04;table.receiveShadow=true;S.add(table);

// faces: capa, folha de rosto, 17 dias e páginas em branco
const F=[mkCover(),mkInside(),...E.map((e,j)=>mkPage(2+j,e))];while(F.length<2*N)F.push(mkPage(F.length,null));
const book=new T.Group();S.add(book);const leaves=[];
for(let i=0;i<N;i++){const cov=!i,w=W+(cov?.05:0),h=H+(cov?.08:0),g=new T.Group();
 const mk=(tx,back)=>{const ge=new T.BufferGeometry(),P=new Float32Array((NS+1)*6),U=new Float32Array((NS+1)*4),I=[];
  for(let j=0;j<=NS;j++){const u=back?1-j/NS:j/NS;U.set([u,0,u,1],j*4)}
  for(let j=0;j<NS;j++){const a=j*2,b=a+2,c=a+1,d=a+3;back?I.push(a,c,b,b,c,d):I.push(a,b,c,b,d,c)}
  ge.setAttribute('position',new T.BufferAttribute(P,3));ge.setAttribute('uv',new T.BufferAttribute(U,2));ge.setIndex(I);
  const m=new T.Mesh(ge,new T.MeshLambertMaterial({map:tx}));m.castShadow=m.receiveShadow=m.frustumCulled=true;m.frustumCulled=false;g.add(m);return m};
 leaves.push({i,g,w,h,p:0,tg:0,f:mk(F[2*i]),b:mk(F[2*i+1],1),o:cov?.006:.003});book.add(g)}
function bend(L){const th=L.p*Math.PI,k=.5*Math.sin(th),ds=L.w/NS;let x=0,y=0;
 for(let j=0;j<=NS;j++){const a=th-k*j/NS;if(j){x+=Math.cos(a)*ds;y+=Math.sin(a)*ds}const nx=-Math.sin(a),ny=Math.cos(a);
  [L.f,L.b].forEach((m,q)=>{const o=q?-L.o:L.o,P=m.geometry.attributes.position;P.setXYZ(j*2,x+nx*o,y+ny*o,L.h/2);P.setXYZ(j*2+1,x+nx*o,y+ny*o,-L.h/2)})}
 [L.f,L.b].forEach(m=>{m.geometry.attributes.position.needsUpdate=true;m.geometry.computeVertexNormals()});
 L.g.position.y=.004+(N-L.i)*t+((L.i+1)-(N-L.i))*t*L.p}
// contracapa e miolo (o miolo só aparece nas laterais, escondido sob a folha de cima)
const mat=c=>new T.MeshLambertMaterial({color:c});
const board=new T.Mesh(new T.BoxGeometry(W+.05,.04,H+.08),mat(0x2f5d62));board.position.set((W+.05)/2,-.02,0);
const cR=new T.Mesh(new T.BoxGeometry(1,1,H-.02),mat(0xe8dfc6)),cL=cR.clone();
[board,cR,cL].forEach(m=>{m.castShadow=m.receiveShadow=true;book.add(m)});
let idx=0;
function cores(){const r=Math.max(.001,.004+(N-idx)*t-.0065),l=Math.max(.001,.004+idx*t-.0065);
 cR.scale.set(W-.02,r,1);cR.position.set((W-.02)/2,r/2,0);cL.scale.set(W-.02,l,1);cL.position.set(-(W-.02)/2,l/2,0)}
leaves.forEach(bend);cores();

const next=()=>{if(idx<N){leaves[idx].tg=1;idx++;cores()}},prev=()=>{if(idx>0){idx--;leaves[idx].tg=0;cores()}};
const rc=new T.Raycaster(),pl=new T.Plane(new T.Vector3(0,1,0),-.08),pt=new T.Vector3();
function side(e){rc.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),cam);
 if(!rc.ray.intersectPlane(pl,pt)||Math.abs(pt.z)>H/2+.1)return 0;const x=pt.x-book.position.x;
 return x>0&&x<W+.1?1:(x<0&&x>-W-.1&&idx>0?-1:0)}
let dg=null;
cn.addEventListener('contextmenu',e=>e.preventDefault());
cn.addEventListener('pointerdown',e=>{dg={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,pan:e.button>0||e.shiftKey,mv:false};cn.setPointerCapture(e.pointerId)});
cn.addEventListener('pointerup',e=>{const w=dg;dg=null;cn.style.cursor='grab';if(!w||w.mv||w.pan||e.button>0)return;const s=side(e);s>0?next():s<0&&prev()});
cn.addEventListener('pointercancel',()=>{dg=null});
cn.addEventListener('pointermove',e=>{
 if(dg){const dx=e.clientX-dg.x,dy=e.clientY-dg.y;dg.x=e.clientX;dg.y=e.clientY;
  if(!dg.mv&&Math.hypot(e.clientX-dg.sx,e.clientY-dg.sy)>6)dg.mv=true;
  if(dg.mv){cn.style.cursor='grabbing';
   if(dg.pan){const k=cs.base*zm*.0012,sy=Math.sin(cs.yaw),cy=Math.cos(cs.yaw);cs.t.x+=-cy*dx*k-sy*dy*k;cs.t.z+=sy*dx*k-cy*dy*k}
   else{cs.yaw-=dx*.006;cs.pitch=cl(cs.pitch+dy*.006,.1,1.5)}}
  return}
 cn.style.cursor=side(e)?'pointer':'grab'});
document.getElementById('bn').onclick=next;document.getElementById('bp').onclick=prev;
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key=='PageDown'||e.key==' '){e.preventDefault();next()}else if(e.key=='ArrowLeft'||e.key=='PageUp'){e.preventDefault();prev()}});
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),P0=.963,K={};
const cs={yaw:0,pitch:P0,t:new T.Vector3(0,0,.05),base:5};let zm=1;
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.near=.02;cam.updateProjectionMatrix();cs.base=Math.max(3.9,4.9/cam.aspect)}
function camStep(dt){
 const mv=(K.KeyW?1:0)-(K.KeyS?1:0),st=(K.KeyD?1:0)-(K.KeyA?1:0),ud=(K.KeyE?1:0)-(K.KeyQ?1:0),d=cs.base*zm;
 if(mv||st||ud){const sp=d*.55*dt*(K.ShiftLeft||K.ShiftRight?2.5:1),sy=Math.sin(cs.yaw),cy=Math.cos(cs.yaw);
  cs.t.x+=(-sy*mv+cy*st)*sp;cs.t.z+=(-cy*mv-sy*st)*sp;cs.t.y+=ud*sp}
 cs.t.set(cl(cs.t.x,-8,8),cl(cs.t.y,0,4),cl(cs.t.z,-8,8));
 const cp=Math.cos(cs.pitch);
 cam.position.set(cs.t.x+Math.sin(cs.yaw)*cp*d,cs.t.y+Math.sin(cs.pitch)*d,cs.t.z+Math.cos(cs.yaw)*cp*d);cam.lookAt(cs.t)}
addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='KeyR'){cs.yaw=0;cs.pitch=P0;cs.t.set(0,0,.05);zm=1}});
addEventListener('keyup',e=>{delete K[e.code]});
addEventListener('blur',()=>{for(const k in K)delete K[k]});
addEventListener('resize',size);size();
cn.addEventListener('wheel',e=>{e.preventDefault();zm=cl(zm*(1+e.deltaY*.001),.15,2)},{passive:false});

const clk=new T.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);let pa=0;camStep(dt);
 leaves.forEach(L=>{if(L.p!==L.tg){L.p+=(L.tg-L.p)*(1-Math.exp(-dt*6));if(Math.abs(L.tg-L.p)<.002)L.p=L.tg;bend(L)}pa+=L.p});
 book.position.x=W*(pa/N-.5);R.render(S,cam)})();
}
Promise.race([Promise.all([document.fonts.load('28px Caveat'),document.fonts.load('bold 28px Caveat')]),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(()=>IMG.decode().catch(()=>{})).then(init);
</script></body></html>
