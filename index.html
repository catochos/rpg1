<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acesso RPG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0f12;
            color: #e0e6ed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }
        .login-card h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #58a6ff;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #f0f6fc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #238636;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2ea043;
        }
        #erro {
            color: #f85149;
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>PORTAL DE ACESSO</h2>
        <div class="input-group">
            <input type="text" id="senhaInput" placeholder="Digite a palavra-chave..." autofocus autocomplete="off">
        </div>
        <button onclick="verificarSenha()">Acessar</button>
        <div id="erro"></div>
    </div>

    <script>
        // Função para remover acentos e converter para minúsculas
        function normalizar(texto) {
            return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        // Mapeamento de senhas normalizadas -> arquivo HTML correspondente
        const rotas = {
            "caderno": "Caderno.html",
            "celular": "Celular - c.html",
            "cubo magico": "Cubo Mágico 3D.html",
            "cubo magico 3d": "Cubo Mágico 3D.html",
            "papel amassado": "papel amassado.html",
            "post it": "Post-it.html",
            "post-it": "Post-it.html"
        };

        function verificarSenha() {
            const entrada = document.getElementById("senhaInput").value;
            const entradaNormalizada = normalizar(entrada);
            const erroDiv = document.getElementById("erro");

            if (rotas[entradaNormalizada]) {
                window.location.href = encodeURI(rotas[entradaNormalizada]);
            } else {
                erroDiv.textContent = "Senha incorreta ou item não encontrado!";
            }
        }

        document.getElementById("senhaInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarSenha();
            }
        });
    </script>

</body>
</html>
