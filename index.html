<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao RPG</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
            width: 340px;
        }
        input {
            width: 85%;
            padding: 10px;
            margin: 10px 0;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            text-align: center;
            font-size: 15px;
        }
        button.btn-acessar {
            width: 92%;
            padding: 10px;
            background: #4CAF50;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        button.btn-acessar:hover {
            background: #45a049;
        }
        .lista-senhas {
            border-top: 1px solid #333;
            padding-top: 15px;
            text-align: left;
        }
        .lista-senhas p {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .atalhos-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .btn-atalho {
            background: #2d2d2d;
            border: 1px solid #444;
            color: #ddd;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            justify-content: space-between;
        }
        .btn-atalho:hover {
            background: #383838;
            border-color: #666;
            color: #fff;
        }
        .btn-atalho span {
            color: #4CAF50;
            font-family: monospace;
        }
        #erro {
            color: #ff5252;
            margin-top: 8px;
            font-size: 13px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Entrar na Sessão</h2>
        <input type="password" id="senhaInput" placeholder="Digite a senha..." autofocus>
        <button class="btn-acessar" onclick="verificarSenha()">Acessar</button>
        <div id="erro"></div>

        <div class="lista-senhas">
            <p>Atalhos rápidos (Páginas)</p>
            <div class="atalhos-container">
                <button class="btn-atalho" onclick="acessarDireto('caderno.html')">Caderno <span>caderno</span></button>
                <button class="btn-atalho" onclick="acessarDireto('Celular - c.html')">Celular <span>celular</span></button>
                <button class="btn-atalho" onclick="acessarDireto('Cubo Mágico 3D.html')">Cubo Mágico 3D <span>cubo magico</span></button>
                <button class="btn-atalho" onclick="acessarDireto('papel amassado.html')">Papel Amassado <span>papel amassado</span></button>
                <button class="btn-atalho" onclick="acessarDireto('Post-it.html')">Post-it <span>post-it</span></button>
            </div>
        </div>
    </div>

    <script>
        // Mapeamento de senhas limpas para os arquivos reais
        const rotas = {
            "caderno": "Caderno.html",
            "celular": "Celular - c.html",
            "cubo magico": "Cubo Mágico 3D.html",
            "cubo magico 3d": "Cubo Mágico 3D.html",
            "papel amassado": "papel amassado.html",
            "post-it": "Post-it.html",
            "post it": "Post-it.html"
        };

        function normalizar(texto) {
            return texto.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function verificarSenha() {
            const valorDigitado = normalizar(document.getElementById("senhaInput").value);
            const erroDiv = document.getElementById("erro");

            if (rotas[valorDigitado]) {
                window.location.href = rotas[valorDigitado];
            } else {
                erroDiv.textContent = "Senha incorreta!";
            }
        }

        function acessarDireto(pagina) {
            window.location.href = pagina;
        }

        // Permitir apertar "Enter" para enviar
        document.getElementById("senhaInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarSenha();
            }
        });
    </script>

</body>
</html>
