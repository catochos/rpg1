<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao RPG</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        input {
            width: 85%;
            padding: 10px;
            margin: 15px 0 10px 0;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        button.btn-acessar {
            width: 92%;
            padding: 10px;
            background: #4CAF50;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button.btn-acessar:hover {
            background: #45a049;
        }
        #erro {
            color: #ff5252;
            margin-top: 10px;
            font-size: 14px;
        }
        .atalhos-container {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 15px;
            text-align: left;
        }
        .atalhos-container h4 {
            margin: 0 0 10px 0;
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .atalho-btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ddd;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: background 0.2s;
        }
        .atalho-btn:hover {
            background: #383838;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Entrar na Sessão</h2>
        <input type="password" id="senhaInput" placeholder="Digite a senha..." autofocus>
        <button class="btn-acessar" onclick="tentarAcessar()">Acessar</button>
        <div id="erro"></div>

        <!-- Seção de Atalhos Dinâmicos -->
        <div id="secaoAtalhos" class="atalhos-container" style="display: none;">
            <h4>Atalhos Desbloqueados</h4>
            <div id="listaAtalhos"></div>
        </div>
    </div>

    <script>
        // Mapeamento de Senhas -> Páginas HTML e Nomes de Exibição dos Atalhos
        const rotas = {
            "caderno": { arquivo: "Caderno.html", nome: "Caderno" },
            "celular": { arquivo: "Celular - c.html", nome: "Celular" },
            "cubo magico": { arquivo: "Cubo Mágico 3D.html", nome: "Cubo Mágico 3D" },
            "cubo magico 3d": { arquivo: "Cubo Mágico 3D.html", nome: "Cubo Mágico 3D" },
            "papel amassado": { arquivo: "papel amassado.html", nome: "Papel Amassado" },
            "post it": { arquivo: "Post-it.html", nome: "Post-it" },
            "post-it": { arquivo: "Post-it.html", nome: "Post-it" }
        };

        function normalizarTexto(texto) {
            return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function carregarAtalhos() {
            const listaAtalhosDiv = document.getElementById("listaAtalhos");
            const secaoAtalhos = document.getElementById("secaoAtalhos");
            listaAtalhosDiv.innerHTML = "";

            // Busca do localStorage as senhas já usadas com sucesso
            let atalhosSalvos = JSON.parse(localStorage.getItem("rpg_atalhos_desbloqueados")) || [];

            if (atalhosSalvos.length > 0) {
                secaoAtalhos.style.display = "block";
                
                // Cria um botão para cada senha desbloqueada única
                atalhosSalvos.forEach(senhaKey => {
                    if (rotas[senhaKey]) {
                        const info = rotas[senhaKey];
                        const btn = document.createElement("button");
                        btn.className = "atalho-btn";
                        btn.textContent = `Acessar: ${info.nome}`;
                        btn.onclick = function() {
                            window.location.href = info.arquivo;
                        };
                        listaAtalhosDiv.appendChild(btn);
                    }
                });
            } else {
                secaoAtalhos.style.display = "none";
            }
        }

        function tentarAcessar() {
            const inputVal = document.getElementById("senhaInput").value;
            const senhaNormalizada = normalizarTexto(inputVal);
            const erroDiv = document.getElementById("erro");

            if (rotas[senhaNormalizada]) {
                // Salva no localStorage que esta senha já foi descoberta
                let atalhosSalvos = JSON.parse(localStorage.getItem("rpg_atalhos_desbloqueados")) || [];
                if (!atalhosSalvos.includes(senhaNormalizada)) {
                    atalhosSalvos.push(senhaNormalizada);
                    localStorage.setItem("rpg_atalhos_desbloqueados", JSON.stringify(atalhosSalvos));
                }

                // Redireciona para o HTML correspondente
                window.location.href = rotas[senhaNormalizada].arquivo;
            } else {
                erroDiv.textContent = "Senha incorreta!";
            }
        }

        // Permitir apertar "Enter" para enviar
        document.getElementById("senhaInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                tentarAcessar();
            }
        });

        // Carrega os atalhos salvos assim que a página abre
        window.onload = carregarAtalhos;
    </script>

</body>
</html>
